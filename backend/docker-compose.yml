version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: PBL6_db
    restart: always
    environment:
      POSTGRES_DB: PBL6
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/PBL6.sql:/PBL6.sql:ro

  pgadmin:
    image: dpage/pgadmin4
    container_name: pbl6_pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@gmail.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres

volumes:
  postgres_data: 