# Standalone cloud stack. Use this file alone, not merged with docker-compose.yml.
# Database URLs come from backend/.env and face_auth/.env. No automatic migrations.
name: pbl6
services:
  face-auth:
    build: ./face_auth
    restart: unless-stopped
    environment:
      MODEL_PACK_NAME: ${PBL6_FACE_MODEL_PACK:-buffalo_s}
      EMBEDDING_MODEL_VERSION: ${PBL6_FACE_MODEL_PACK:-buffalo_s}
      MODEL_CTX_ID: -1
      PAD_RUNTIME_CONFIG_PATH: ''
      PAD_ADAPTIVE_ENABLED: 'false'
    ports:
    - 127.0.0.1:${PBL6_FACE_API_PORT:-5000}:5000
    volumes:
    - ${PBL6_INSIGHTFACE_CACHE:-insightface_models}:/root/.insightface
    - ./face_auth/gallery:/app/gallery:ro
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health',
        timeout=5)
      interval: 10s
      timeout: 8s
      retries: 12
      start_period: 120s
    env_file: ./face_auth/.env
  mqtt:
    image: eclipse-mosquitto:2
    restart: unless-stopped
    volumes:
    - ./docker/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
  backend:
    image: pbl6-backend:local
    build: ./backend
    restart: unless-stopped
    env_file: ./backend/.env
    environment:
      NODE_ENV: ${PBL6_NODE_ENV:-development}
      PORT: 3000
      FACE_AUTH_URL: http://face-auth:5000
      FACE_AUTH_MODEL_VERSION: ${PBL6_FACE_MODEL_PACK:-buffalo_s}
      MQTT_URL: mqtt://mqtt:1883
      MQTT_USERNAME: ''
      MQTT_PASSWORD: ''
      CORS_ORIGIN: ${PBL6_CORS_ORIGIN:-http://localhost:8080,http://127.0.0.1:8080}
    ports:
    - 127.0.0.1:${PBL6_BACKEND_PORT:-3000}:3000
    healthcheck:
      test:
      - CMD
      - node
      - -e
      - fetch('http://127.0.0.1:3000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 12
    depends_on:
      face-auth:
        condition: service_healthy
      mqtt:
        condition: service_started
  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
    - ${PBL6_WEB_BIND_IP:-127.0.0.1}:${PBL6_WEB_PORT:-8080}:80
    depends_on:
      backend:
        condition: service_healthy
volumes:
  insightface_models: null
