name: pbl6

x-logging: &iot-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # 1. ThingsBoard IoT Platform (Bản tích hợp sẵn DB Postgres nội bộ)
  # Pin image version/digest after ARM64 verification (never rely on floating :latest in production).
  # Bind IOT_BIND_IP to the VPN/Tailscale or LAN IP (defaults to 127.0.0.1, never public 0.0.0.0).
  thingsboard:
    image: ${TB_IMAGE:-thingsboard/tb-postgres:3.8.1}
    container_name: smartface_thingsboard
    restart: unless-stopped
    logging: *iot-logging
    ports:
      - "${TB_ADMIN_BIND_IP:-127.0.0.1}:${TB_WEB_PORT:-8081}:9090" # Trang quản trị chỉ bind loopback/VPN
      - "${IOT_BIND_IP:-127.0.0.1}:1883:1883"                      # MQTT Broker cho Pi qua VPN/LAN riêng
      - "${IOT_BIND_IP:-127.0.0.1}:7070:7070"                      # Edge RPC nội bộ/VPN
    environment:
      TB_QUEUE_TYPE: in-memory
    volumes:
      - tb-data:/data
      - tb-logs:/var/log/thingsboard
    extra_hosts:
      - "host.docker.internal:host-gateway" # Giúp container gọi được Node.js đang chạy ở máy thật

  # 2. MediaMTX - Máy chủ nhận luồng RTSP từ Pi và phát WebRTC lên Web
  mediamtx:
    image: ${MEDIAMTX_IMAGE:-bluenviron/mediamtx:1.9.3}
    container_name: smartface_mediamtx
    restart: unless-stopped
    logging: *iot-logging
    ports:
      - "${IOT_BIND_IP:-127.0.0.1}:8554:8554"          # RTSP từ Pi qua VPN/LAN riêng
      - "${IOT_BIND_IP:-127.0.0.1}:8889:8889"          # WHEP signaling (proxy qua HTTPS/auth, không public thô)
      - "${MEDIAMTX_MEDIA_BIND_IP:-127.0.0.1}:8189:8189/udp" # Media WebRTC UDP (chỉ mở theo phương án video đã chốt)
    environment:
      MTX_RTSPTRANSPORTS: tcp
      MTX_WEBRTCADDITIONALHOSTS: "${IOT_SERVER_HOST:?Set IOT_SERVER_HOST in .env.iot}" # IP VPN/LAN máy server

volumes:
  tb-data:
  tb-logs:
