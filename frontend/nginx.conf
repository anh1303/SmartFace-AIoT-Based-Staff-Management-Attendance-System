# Preserve X-Forwarded-Proto ONLY from the trusted edge proxy (Caddy -> Nginx -> Node).
# Port 80 must remain bound to loopback / internal Docker network, never exposed publicly.
map $http_x_forwarded_proto $trusted_forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80;
    root /usr/share/nginx/html;
    client_max_body_size 20m;

    location ~ ^/api/(v1/)?auth/face-login(/|$) {
        client_max_body_size 2200k;
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $trusted_forwarded_proto;
        proxy_read_timeout 25s;
    }

    location /api/ {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $trusted_forwarded_proto;
        proxy_read_timeout 120s;
    }

    location /socket.io/ {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $trusted_forwarded_proto;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
